<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 690" role="img" aria-labelledby="title desc">
<title id="title">How a recurrent model and causal attention use earlier characters</title>
<desc id="desc">Two vertically stacked diagrams. A recurrent network passes hidden state between positions. A causal attention network draws from the current and preceding input characters.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#23323c}.h{font-size:24px;font-weight:700}.s{font-size:18px;fill:#53646f}.tok{font-size:23px;font-weight:700;text-anchor:middle}.box{fill:#e9f1f8;stroke:#3778ab;stroke-width:2}.att{fill:#e7f5ed;stroke:#258363;stroke-width:2}.frame{fill:#fff;stroke:#cad3d8;stroke-width:1.5}.line{fill:none;stroke:#526976;stroke-width:2.3;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#526976"/></marker></defs>
<rect class="frame" x="8" y="8" width="484" height="317" rx="12"/><rect class="frame" x="8" y="339" width="484" height="342" rx="12"/>
<text class="h" x="28" y="48">A  Recurrent model</text><text class="s" x="28" y="78">Hidden state passes through each position.</text>
<g class="line"><path d="M118 167H150"/><path d="M210 167H242"/><path d="M302 167H334"/><path d="M89 230V201"/><path d="M181 230V201"/><path d="M273 230V201"/><path d="M365 230V201"/></g>
<g class="box"><rect x="58" y="138" width="60" height="62" rx="7"/><rect x="150" y="138" width="60" height="62" rx="7"/><rect x="242" y="138" width="60" height="62" rx="7"/><rect x="334" y="138" width="60" height="62" rx="7"/></g>
<g class="tok"><text x="88" y="175">h₁</text><text x="180" y="175">h₂</text><text x="272" y="175">h₃</text><text x="364" y="175">h₄</text><text x="88" y="256">T</text><text x="180" y="256">h</text><text x="272" y="256">e</text><text x="364" y="256">␠</text></g>
<text class="s" x="28" y="291">Each state uses its current character and</text><text class="s" x="28" y="313">the hidden state from the previous step.</text>
<text class="h" x="28" y="382">B  Causal attention</text><text class="s" x="28" y="412">The current position consults earlier inputs.</text>
<g class="att"><rect x="30" y="451" width="66" height="58" rx="8"/><rect x="148" y="451" width="66" height="58" rx="8"/><rect x="266" y="451" width="66" height="58" rx="8"/><rect x="384" y="451" width="66" height="58" rx="8"/><rect x="198" y="568" width="104" height="47" rx="8"/></g>
<g class="tok"><text x="63" y="486">T</text><text x="181" y="486">h</text><text x="299" y="486">e</text><text x="417" y="486">␠</text></g>
<g class="line"><path d="M63 509L221 568"/><path d="M181 509L240 568"/><path d="M299 509L260 568"/><path d="M417 509L283 568"/></g>
<text x="250" y="598" text-anchor="middle" font-size="17" font-family="Arial,Helvetica,sans-serif" fill="#23323c">Attention</text>
<text class="s" x="28" y="645">Future target characters remain masked.</text>
</svg>
